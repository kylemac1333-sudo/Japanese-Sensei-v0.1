<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#bc002d">
  <title>Japanese Sensei 🇯🇵</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23bc002d'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white'%3E🇯🇵%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- App container -->
  <div id="app" class="app-container">
    <!-- Screen content will be rendered by app.js -->
  </div>

  <!-- Bottom navigation (visible on all screens except profile selection) -->
  <nav id="bottom-nav" class="bottom-nav hidden" aria-label="Main navigation">
    <button data-screen="home" class="nav-btn" aria-label="Home">🏠<span>Home</span></button>
    <button data-screen="lessons" class="nav-btn" aria-label="Lessons">📚<span>Lessons</span></button>
    <button data-screen="leaderboard" class="nav-btn" aria-label="Leaderboard">🏆<span>Leaderboard</span></button>
    <button data-screen="profile" class="nav-btn" aria-label="Profile">👤<span>Profile</span></button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
